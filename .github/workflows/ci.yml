name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run selftest
      - run: npm run build:beta
      - run: npm run check:evaluation-artifacts
      - run: npm run smoke:beta-install
      - run: npm run smoke:package-install
      # The plugin bundle is committed, but Claude Code has no install-time
      # build step — so a stale bin/hook.cjs means testers silently run
      # different logic than this repo shows. Rebuild and fail on any drift.
      - name: Plugin bundle is up to date
        if: matrix.os == 'ubuntu-latest' # drift check on one OS; CRLF checkouts would false-positive on Windows
        run: |
          npm run build:plugin
          git diff --exit-code -- plugin/claude-code/bin/hook.cjs
